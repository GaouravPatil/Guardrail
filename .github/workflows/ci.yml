name: CI/CD - Build, Scan, Push, Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default: read-only permissions.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gaouravpatil/guardrail

jobs:
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Go setup
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      # ---------------------------------------------------------
      # 3. Code quality
      # ---------------------------------------------------------
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      # ---------------------------------------------------------
      # 4. Set image name
      # ---------------------------------------------------------
      - name: Set image metadata
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/guardrail"
          IMAGE_NAME="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 5. Login to GHCR
      # ---------------------------------------------------------
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 6. Setup Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 7. Build image
      #
      # PR:
      #   Build only, don't push.
      #
      # main:
      #   Build and push immutable SHA image + latest.
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true

      # ---------------------------------------------------------
      # 8. Scan the exact image pushed to GHCR
      # ---------------------------------------------------------
      - name: Scan image with Trivy
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # =============================================================
  # DEPLOY
  # =============================================================

  deploy:
    name: Deploy to Kubernetes
    needs: build-scan-push

    # Deploy only after a successful push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted
    timeout-minutes: 10

    concurrency:
      group: guardrail-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      # ---------------------------------------------------------
      # 1. Checkout the exact commit that was built
      # ---------------------------------------------------------
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Verify kubectl exists
      # ---------------------------------------------------------
      - name: Verify Kubernetes access
        run: |
          kubectl version --client
          kubectl cluster-info

      # ---------------------------------------------------------
      # 3. Deploy immutable image
      # ---------------------------------------------------------
      - name: Deploy and verify
        env:
          IMAGE_NAME: ghcr.io/gaouravpatil/guardrail
          IMAGE_TAG: ${{ github.sha }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          chmod +x scripts/deploy-and-verify.sh
          chmod +x scripts/health-check.sh

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}" \
          EXPECTED_VERSION="${EXPECTED_VERSION}" \
          ./scripts/deploy-and-verify.sh
