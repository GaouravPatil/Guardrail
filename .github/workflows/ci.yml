name: CI/CD - Build, Push, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs escalate only what they need.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # needed to push to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit that triggered the run; the default
          # branch tip can race ahead on a busy repo.
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: Run vet + tests
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository_owner }}/guardrail | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        # Only real pushes need to log in / push; PRs from forks can't.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan image with Trivy
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    needs: build-and-push
    # Deploy only on pushes to main — PRs build but never touch the cluster.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: guardrail-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Deploy and verify (immutable SHA, no YAML sed)
        run: |
          chmod +x scripts/deploy-and-verify.sh scripts/health-check.sh
          IMAGE_NAME="$(echo "ghcr.io/${{ github.repository_owner }}/guardrail" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${IMAGE_NAME}:${{ github.sha }}" EXPECTED_VERSION="${{ github.sha }}" ./scripts/deploy-and-verify.sh
