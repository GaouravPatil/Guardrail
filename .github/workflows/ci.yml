# Guardrail CI/CD: test -> build locally -> scan -> push (main only) -> deploy.
# Rule: an image reaches GHCR only AFTER Trivy passes. Deploy installs the exact SHA.
# (Want provenance/SBOM + Security-tab SARIF back? See note on the push step.)

name: CI/CD - Build, Scan, Push, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual redeploy / rollback drill

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.27.2" # keep in sync with Dockerfile + go.mod

jobs:
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write # push to GHCR (push events only)

    # Contract with the deploy job: it installs exactly this image:tag.
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Fail fast here (~30s) instead of after a 5-minute image build.
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      # Plain `go test` (no -race): ~2-3x faster. Re-add `-race` if you want
      # the data-race detector back and accept the slower run.
      - name: Run tests
        run: go test -count=1 ./...

      # GHCR names must be lowercase; owner may not be. One definition only
      # (forks work). Tag = full commit SHA: immutable, traceable to commit.
      - name: Compute image name
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${{ env.REGISTRY }}/${OWNER}/guardrail" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single build. Loaded locally so Trivy can scan it before any push.
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: guardrail:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate: runs on PRs too. HIGH/CRITICAL (with fixes) fail the run
      # BEFORE anything is pushed.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: guardrail:ci-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Push the ALREADY-SCANNED bytes: retag + push, no rebuild.
      # K8s deploys the SHA; `latest` is convenience only, never used by k8s.
      # (Dropped for speed: 2nd Trivy/SARIF run, 2nd build, provenance+sbom
      # attestations which also needed `id-token: write`. Re-add if wanted.)
      - name: Tag and push scanned image
        if: github.event_name == 'push'
        run: |
          docker tag guardrail:ci-scan "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker tag guardrail:ci-scan "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

  # Deploys only after Job 1 pushed the scanned SHA. Timing here is
  # intentional waiting (rollout + health polling), not waste.
  deploy:
    name: Deploy to Kubernetes
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted # TIP: pin a label, e.g. [self-hosted, linux, guardrail]
    timeout-minutes: 10

    concurrency:
      group: guardrail-deploy
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      # Exact commit that was built/scanned — deploy its scripts.
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify Kubernetes access
        run: |
          kubectl version --client=true
          kubectl cluster-info

      # Pins image via `kubectl set image` (no YAML edits), stamps
      # APP_VERSION so /health reports the SHA, verifies, auto-rolls back.
      - name: Deploy and verify
        env:
          IMAGE_NAME: ${{ needs.build-scan-push.outputs.image }}
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.build-scan-push.outputs.tag }}
        run: |
          chmod +x scripts/deploy-and-verify.sh scripts/health-check.sh
          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}" \
          EXPECTED_VERSION="${EXPECTED_VERSION}" \
          ./scripts/deploy-and-verify.sh
