apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guardrail
  namespace: guardrail
spec:
  ingressClassName: nginx
  rules:
    - host: guardrail.gaourav.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guardrail
                port:
                  name: http
