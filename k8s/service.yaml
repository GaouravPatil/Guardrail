apiVersion: v1
kind: Service
metadata:
  name: guardrail
  labels:
    app: guardrail
spec:
  # ClusterIP: reachable in-cluster + via port-forward.
  # NodePort exposed the app on every node with a random port; use an
  # Ingress for external traffic instead.
  type: ClusterIP
  selector:
    app: guardrail
  ports:
    - name: http
      port: 5000
      targetPort: http
