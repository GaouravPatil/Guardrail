apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'guardrail'
        metrics_path: /metrics
        # 5s (not 15s): a 30s rollout with a 10s outage is invisible at 15s.
        scrape_interval: 5s
        static_configs:
          - targets: ['guardrail:5000']
