apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail
  namespace: guardrail
spec:
  replicas: 3
  selector:
    matchLabels:
      app: guardrail
  template:
    metadata:
      labels:
        app: guardrail
    spec:
      containers:
        - name: guardrail
          image: ghcr.io/gaouravpatil/guardrail:dev
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: guardrail-config
                  key: PORT
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: guardrail-config
                  key: APP_VERSION
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
